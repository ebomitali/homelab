# AdGuard Home: DNS con filtro pubblicitario.
# Interfaccia: http://adguard.${DOMAIN} (via Traefik; DOMAIN nel .env dello stack)
# Primo avvio: la configurazione guidata risponde sulla porta 3000 del container.
# Il wizard ha impostato la web UI sulla porta 80 (il default): la label
# `loadbalancer.server.port` di conseguenza.
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.80
    container_name: adguardhome
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    # DATA_ROOT: cartella `data/` dell'host (variabile dello stack in Portainer).
    # Serve un path assoluto perché lo stack viene eseguito da Portainer,
    # non dalla cartella del repository.
    volumes:
      - ${DATA_ROOT:?impostare DATA_ROOT}/adguard/work:/opt/adguardhome/work
      - ${DATA_ROOT:?impostare DATA_ROOT}/adguard/conf:/opt/adguardhome/conf
    # Eccezione (vedi CLAUDE.md): DNS solo sull'IP LAN del server (rete domestica), non su tutte le interfacce.
    ports:
      - "192.168.1.11:53:53/udp"
      - "192.168.1.11:53:53/tcp"
    networks:
      - homelab
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN:?impostare DOMAIN}`)
      - traefik.http.routers.adguard.entrypoints=web
      - traefik.http.services.adguard.loadbalancer.server.port=80

networks:
  homelab:
    external: true
